name: Scheduled Scraping

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraping mode'
        required: true
        default: 'all-pending'
        type: choice
        options:
          - all-pending
          - preview-only

  # Automated schedule: every Monday at 06:00 UTC (03:00 BRT)
  schedule:
    - cron: '0 6 * * 1'

env:
  API_URL: ${{ secrets.API_URL }}
  API_TOKEN: ${{ secrets.API_SERVICE_TOKEN }}

jobs:
  scrape:
    name: Execute Scraping
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check API is healthy
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
          if [ "$status" != "200" ]; then
            echo "API not healthy (status=$status), aborting"
            exit 1
          fi
          echo "API healthy"

      - name: Execute all pending scraping runs
        if: github.event.inputs.mode != 'preview-only'
        run: |
          response=$(curl -s -X POST \
            "$API_URL/api/v1/scraping/executar-todos" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json")
          echo "Response: $response"

          echo "$response" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          started = data.get('started', 0)
          print(f'Started: {started} runs')
          if started == 0:
            print('No pending runs found')
          " 2>/dev/null || true

      - name: Get scraping stats
        run: |
          curl -s "$API_URL/api/v1/scraping/monitor/overview" \
            -H "Authorization: Bearer $API_TOKEN" | python3 -m json.tool
